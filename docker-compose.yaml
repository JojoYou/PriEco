services:
  prieco:
    build:
      context: .
      dockerfile: Dockerfile
    image: prieco:latest
    ports:
      - "8000:8000"
    read_only: true
    volumes:
      - ./data:/app/data:z
      - ./data/tantivy:/app/data/tantivy:z
      - ./data/blobs:/app/data/blobs:z
      - ./models:/app/models:z
      - ./GeoLite2-Country.mmdb:/app/GeoLite2-Country.mmdb:z
    environment:
      - ROCKET_ADDRESS=0.0.0.0
      - ROCKET_PORT=8000
      - PRIECO_IP=${PRIECO_IP:-0.0.0.0}
      - PRIECO_PORT=${PRIECO_PORT:-8000}
      - PRIECO_TANTIVY=data/tantivy
      - PRIECO_META=data/rocksdb
      - PRIECO_VECTOR=data/vectors
      - PRIECO_BLOB=data/blobs
      - PRIECO_WORKERS=1

    labels:
      # Podman auto-update
      - "io.containers.autoupdate=registry"
      # Watchtower track
      - "com.centurylinklabs.watchtower.enable=true"

    ulimits:
      nofile:
        soft: 65535
        hard: 65535

    tty: true

    restart: unless-stopped
