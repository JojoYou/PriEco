[workspace]
members = [
    "crates/core",
    "crates/blob",
    "crates/pagerank",
    "crates/insert",
    "crates/web",
    "crates/crawler"
]
resolver = "2"

[profile.release]
#debug = true # Profiling
# Performance
opt-level = 3            # Optimization level
debug-assertions = false # Disables debug code
codegen-units = 1

# Size
strip = true
debug = 0
lto = "thin"


[workspace.dependencies]
# Mapping
prieco_core = { path = "crates/core" }
prieco_blob = { path = "crates/blob" }
prieco_pagerank = { path = "crates/pagerank" }
prieco_insert = { path = "crates/insert" }
prieco_mini_crawler = { path = "crates/crawler" }

# Essentials
tikv-jemallocator = "0.6.0" # Memory allocator
dotenv_codegen = "0.15.0" # .env file
num_cpus = "1.17.0" # Number of CPU cores
once_cell = "1.20.3" # Global variables
parking_lot = "0.12.5" # Global variables mutexes
reqwest = { version = "0.12.23", default-features = false, features = ["json", "gzip", "brotli", "deflate", "blocking", "cookies", "rustls-tls", "http2"] } # Out HTTP reqvest client
rand = { version = "0.9.0", features = ["std", "std_rng"] } # Random number generator
dashmap = "6.1.0" # Multi threaded hashmap
rayon = "1.11.0" # Paralel code execution
memmap2 = "0.9.10"
libc = "0.2.186"

# Web server
rocket = { version = "0.5.1", features = ["json"] } # Web server
rocket_dyn_templates = { version = "0.1.0", features = ["handlebars"] } # Template engine
socket2 = "0.6.0" # Sockets (Run old and new instance on same port for smooth update)
tokio = { version = "1.37.0", features = ["full"] }
serde = "1.0.219"
serde_json = "1.0.142"

# Blob storage
flate2 = "1.1.9" # Streamed file compression and decompression (RAM)
tar = "0.4.44" # Tar archive

# Database
rocksdb = "0.24.0" # Results' data
tantivy = "0.25.0" # Full-text index
zip = "8.6.0" # Stream zip results files to index
redb = "3.0.1"            # Key-Value

# Vector embedding
ort = { path = "vendor/ort-1.16.3" } # Query to vector
tokenizers = "0.21.1" # Ort model tokenizer
cudarc = { version = "0.19.2" } # Nvidia GPU, used for comparing cosine distance between vectors
ndarray = "0.15.1"
bytemuck = "1.25.0"

# Mini crawler
bincode-next = { version = "2.1.0", features = ["serde"] }
scraper = "0.23.1" # HTML management
regex = "1.11.1" # Regular expressions
whatlang = "0.16.4"  # Language detection from text
maxminddb = "0.24.0" # Reading Maxmind DB for IP to country
env_logger = "0.11.8" # Logger: Used to disable Foster parenting not implemented
log = "0.4.28"# Logger: Used to disable Foster parenting not implemented

# Tools
ahash = "0.8.12"      # Faster single threaded hashmap
twox-hash = "2.1.0" # Predictable hash
url = "2.5.2"         # URL manager
urlencoding = "2.1.3" # URL encoder/decoder
brotli = "8.0.2" # Google compression for html, css, js
zstd = "0.13.3" # Zstandard compression
mime_guess = "2.0.5"
chrono = "0.4.43" # Datetime
image = "0.25.8" # Image manipulation


# ARM build command
# RUSTFLAGS="-C target-cpu=cortex-a72" JEMALLOC_SYS_WITH_LG_PAGE=16 CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++ cargo build --target aarch64-unknown-linux-gnu --release
