###
# PriEco
###
[workspace.package]
edition = "2024" # Rust Edition

homepage = "https://prieco.net/"
repository = "https://codeberg.org/JojoYou/PriEco/"

version = "3.0.0"                               # PriEco version
authors = ["Roman Láncoš <support@prieco.net>"]
readme = "README.md"
license = "AGPL-3.0-only"

publish = false # Dont publish to crates.io

###
# Workspaces
###
[workspace]
exclude = ["backend/vendor"]
members = [
    "backend/crates/core",
    "backend/crates/blob",
    "backend/crates/pagerank",
    "backend/crates/insert",
    "backend/crates/web",
    "backend/crates/crawler",
]
default-members = [
    "backend/crates/core",
    "backend/crates/blob",
    "backend/crates/pagerank",
    "backend/crates/insert",
    "backend/crates/web",
    "backend/crates/crawler",
]
resolver = "3"

###
# Full performance
###
[profile.release]
# Performance
opt-level = 3     # Compiler optimization
codegen-units = 1 # Optimizes whole crate
lto = "fat"       # Link-time optimization

# Binary size
strip = true             # Removes debug symbols
debug = 0                # Disables debug information
debug-assertions = false # Removes debug assertions

###
# Almost performance
###
[profile.release-dev]
inherits = "release"

# Performance
opt-level = 1
codegen-units = 1
lto = false

# Binary size
strip = false

###
# Debug mode for tests needs this optimized
###
[profile.dev.package.aho-corasick]
opt-level = 3

[workspace.dependencies]
# Mapping
prieco_core = { path = "backend/crates/core" }
prieco_blob = { path = "backend/crates/blob" }
prieco_pagerank = { path = "backend/crates/pagerank" }
prieco_insert = { path = "backend/crates/insert" }
prieco_mini_crawler = { path = "backend/crates/crawler" }

###
# System
###
# Basic
libc = "0.2.191"
dotenvy = "0.15.7" # .env file
rand = { version = "0.10.4", features = [
    "std",
    "std_rng",
] } # Random number generator
twox-hash = "=2.1.0" # Predictable hash
time = { version = "0.3.55", features = [
    "formatting",
    "parsing",
    "macros",
] } # Datetime

# Variables
once_cell = "1.20.3"   # Global variables
parking_lot = "0.12.5" # Global variables mutexes

# CPU
num_cpus = "1.17.0" # Number of CPU cores
rayon = "1.12.0"    # Paralel code execution

# Ram
tikv-jemallocator = "0.7.0" # Memory allocator

# File
memmap2 = "0.9.12" # Sequencial access
#io-uring = "0.7.16" # Random access

zip = { version = "9.6.0", default-features = false, features = [
    "deflate-flate2-zlib-rs",
] } # Stream zip results files to index

###
# Database
###
# Index
tantivy = "0.27.0" # Full-text index

symspell = "0.5.2" # Spell checker; FTS

# Key-Value storage
fjall = "3.1.13"

###
# Networking
###
# Client
primp = "2.0.1" # HTTP Clinet simulating user (Chrome+Windows); Mini crawler

# Web server
rocket = { version = "0.5.2", features = ["json"] } # Web server
rocket_dyn_templates = { version = "0.1.0", features = [
    "handlebars",
] } # Template engine

# Decentralization
iroh = "1.4.1"
iroh-gossip = "0.102.0"
futures-lite = "2.6.1"
data-encoding = "2.11.1"
n0-future = "0.3.2"

# Full text Search
charabia = "0.10.0" # Lang detection tokenizer
fst = "0.4.7" # Synonyms
aho-corasick = "1.1.4" # Match intent keywords fast
rkyv = { version = "0.8.18", features = [
    "bytecheck",
] } # 0 copy deserialization; Used for places

# Vector embedding
ort = { path = "backend/vendor/ort-1.16.3", default-features = false, features = [
    "half",
] } # Query to vector
tokenizers = "0.23.2" # Ort model tokenizer
cudarc = { version = "0.19.2" } # Nvidia GPU, used for comparing cosine distance between vectors
ndarray = "0.15.1"
bytemuck = "1.25.0"
half = "2.7.1" # F16 embeds

# Mini crawler
bincode-next = { version = "2.1.0", features = ["serde"] }
scraper = "0.29.0"                                         # HTML management
regex = "1.11.1"                                           # Regular expressions
whatlang = "0.18.0"                                        # Language detection from text
maxminddb = "0.33.0"                                       # Reading Maxmind DB for IP to country
env_logger = "0.11.8"                                      # Logger: Used to disable Foster parenting not implemented
log = "0.4.28"                                             # Logger: Used to disable Foster parenting not implemented

# Tools
aes-gcm = "0.11.0"    # Encryption
url = "2.5.2"         # URL manager
urlencoding = "2.1.3" # URL encoder/decoder


# ARM build command
# RUSTFLAGS="-C target-cpu=cortex-a72" JEMALLOC_SYS_WITH_LG_PAGE=16 CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++ cargo build --target aarch64-unknown-linux-gnu --release
# This is just a specific command

# Sort

tokio = { version = "1.37.0", features = ["full"] }

serde = "1.0.229"      # Serialization
serde_json = "1.0.154" # JSON

# Remove

zstd = "0.14.4" # Zstandard compression

reqwest = { version = "0.12.23", default-features = false, features = [
    "json",
    "gzip",
    "brotli",
    "deflate",
    "blocking",
    "cookies",
    "rustls-tls",
    "http2",
] } # HTTP reqvest client
ahash = "0.8.12" # Faster single threaded hashmap
dashmap = "6.1.0" # Multi threaded hashmap

socket2 = "0.6.0" # Sockets (Run old and new instance on same port for smooth update)
